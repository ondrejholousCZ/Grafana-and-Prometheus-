services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [monitoring]

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION}
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [monitoring]

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=0.0.0.0:9100
      - --collector.systemd
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run/docker/netns|var/lib/docker/.+)($|/)
    volumes:
      - /:/host:ro,rslave
      - /run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro

  cadvisor:
    image: ghcr.io/google/cadvisor:${CADVISOR_VERSION}
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]

  blackbox:
    image: prom/blackbox-exporter:${BLACKBOX_VERSION}
    container_name: blackbox
    restart: unless-stopped
    command:
      - --config.file=/config/blackbox.yml
    cap_add:
      - NET_RAW
    volumes:
      - ./blackbox:/config:ro
    networks: [monitoring]

  vmware-exporter:
    image: pryorda/vmware_exporter:${VMWARE_EXPORTER_VERSION}
    container_name: vmware-exporter
    restart: unless-stopped
    env_file:
      - ./secrets/vsphere.env
    dns:
      - 10.0.90.1
    networks: [monitoring]

  snmp-exporter:
    image: prom/snmp-exporter:${SNMP_EXPORTER_VERSION}
    container_name: snmp-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --config.file=/etc/snmp_exporter/custom.yml
      - --config.file=/etc/snmp_auth/snmp-auth.yml
    volumes:
      - ./snmp:/etc/snmp_exporter:ro
      - ./secrets/snmp-auth.yml:/etc/snmp_auth/snmp-auth.yml:ro
    networks: [monitoring]

  ipmi-exporter:
    image: prometheuscommunity/ipmi-exporter:${IPMI_EXPORTER_VERSION}
    container_name: ipmi-exporter
    restart: unless-stopped
    command:
      - --config.file=/config/ipmi.yml
    volumes:
      - ./secrets/ipmi.yml:/config/ipmi.yml:ro
    networks: [monitoring]

  fortigate-exporter:
    image: quay.io/prometheuscommunity/fortigate-exporter:${FORTIGATE_EXPORTER_VERSION}
    container_name: fortigate-exporter
    restart: unless-stopped
    command:
      - -auth-file=/config/fortigate-key.yaml
      - -insecure
    volumes:
      - ./secrets/fortigate-key.yaml:/config/fortigate-key.yaml:ro
    networks: [monitoring]

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  monitoring:
