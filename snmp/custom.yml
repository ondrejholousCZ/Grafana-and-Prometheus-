modules:
  # ---------- Brocade 300 (SW-MIB) ----------
  brocade_fc:
    walk:
      - 1.3.6.1.4.1.1588.2.1.1.1.1.7     # swOperStatus
      - 1.3.6.1.4.1.1588.2.1.1.1.1.22    # swSensorTable
    metrics:
      - name: brocade_switch_oper_status
        oid: 1.3.6.1.4.1.1588.2.1.1.1.1.7
        type: gauge
        help: "swOperStatus: 1=online, 2=offline, 3=testing, 4=faulty"
      - name: brocade_sensor_type
        oid: 1.3.6.1.4.1.1588.2.1.1.1.1.22.1.2
        type: gauge
        help: "swSensorType: 1=temperature, 2=fan, 3=power-supply"
        indexes:
          - labelname: sensor
            type: gauge
        lookups:
          - labels: [sensor]
            labelname: sensor_info
            oid: 1.3.6.1.4.1.1588.2.1.1.1.1.22.1.5
            type: DisplayString
      - name: brocade_sensor_status
        oid: 1.3.6.1.4.1.1588.2.1.1.1.1.22.1.3
        type: gauge
        help: "swSensorStatus: 1=unknown, 2=faulty, 3=below-min, 4=nominal, 5=above-max, 6=absent"
        indexes:
          - labelname: sensor
            type: gauge
        lookups:
          - labels: [sensor]
            labelname: sensor_info
            oid: 1.3.6.1.4.1.1588.2.1.1.1.1.22.1.5
            type: DisplayString
      - name: brocade_sensor_value
        oid: 1.3.6.1.4.1.1588.2.1.1.1.1.22.1.4
        type: gauge
        help: "swSensorValue: teplota °C, ventilátor RPM, zdroj 1=OK"
        indexes:
          - labelname: sensor
            type: gauge
        lookups:
          - labels: [sensor]
            labelname: sensor_info
            oid: 1.3.6.1.4.1.1588.2.1.1.1.1.22.1.5
            type: DisplayString

  # ---------- HPE 5130 / Comware (HH3C-ENTITY-EXT-MIB) ----------
  comware:
    walk:
      - 1.3.6.1.2.1.47.1.1.1.1.7             # entPhysicalName
      - 1.3.6.1.4.1.25506.2.6.1.1.1.1.6      # hh3cEntityExtCpuUsage
      - 1.3.6.1.4.1.25506.2.6.1.1.1.1.8      # hh3cEntityExtMemUsage
      - 1.3.6.1.4.1.25506.2.6.1.1.1.1.12     # hh3cEntityExtTemperature
    metrics:
      - name: comware_entity_cpu_usage_percent
        oid: 1.3.6.1.4.1.25506.2.6.1.1.1.1.6
        type: gauge
        help: "Vytížení CPU entity v %"
        indexes:
          - labelname: entity
            type: gauge
        lookups:
          - labels: [entity]
            labelname: entity_name
            oid: 1.3.6.1.2.1.47.1.1.1.1.7
            type: DisplayString
      - name: comware_entity_memory_usage_percent
        oid: 1.3.6.1.4.1.25506.2.6.1.1.1.1.8
        type: gauge
        help: "Využití paměti entity v %"
        indexes:
          - labelname: entity
            type: gauge
        lookups:
          - labels: [entity]
            labelname: entity_name
            oid: 1.3.6.1.2.1.47.1.1.1.1.7
            type: DisplayString
      - name: comware_entity_temperature_celsius
        oid: 1.3.6.1.4.1.25506.2.6.1.1.1.1.12
        type: gauge
        help: "Teplota entity ve °C"
        indexes:
          - labelname: entity
            type: gauge
        lookups:
          - labels: [entity]
            labelname: entity_name
            oid: 1.3.6.1.2.1.47.1.1.1.1.7
            type: DisplayString

  # ---------- MSA2000 G3 (FCMGMT-MIB) ----------
  msa_fa:
    walk:
      - 1.3.6.1.3.94.1.6.1.6     # connUnitStatus
      - 1.3.6.1.3.94.1.8.1       # connUnitSensorTable
    metrics:
      - name: msa_unit_status
        oid: 1.3.6.1.3.94.1.6.1.6
        type: gauge
        help: "connUnitStatus: 1=unknown, 2=unused, 3=ok, 4=warning, 5=failed"
        indexes:
          - labelname: unit_id
            type: OctetString
            fixed_size: 16
      - name: msa_sensor_status
        oid: 1.3.6.1.3.94.1.8.1.4
        type: gauge
        help: "connUnitSensorStatus: 1=unknown, 2=other, 3=ok, 4=warning, 5=failed"
        indexes:
          - labelname: unit_id
            type: OctetString
            fixed_size: 16
          - labelname: sensor_index
            type: gauge
        lookups:
          - labels: [unit_id, sensor_index]
            labelname: sensor_name
            oid: 1.3.6.1.3.94.1.8.1.3
            type: DisplayString
