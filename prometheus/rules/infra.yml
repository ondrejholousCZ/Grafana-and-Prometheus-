groups:
  - name: vsphere
    rules:
      - alert: VmwareDatastoreLowSpace
        expr: 100 * vmware_datastore_freespace_size / vmware_datastore_capacity_size < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Datastore {{ $labels.ds_name }} má málo místa"
          description: "Volné místo: {{ $value | printf \"%.1f\" }} %."

      - alert: VmwareDatastoreCritical
        expr: 100 * vmware_datastore_freespace_size / vmware_datastore_capacity_size < 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Datastore {{ $labels.ds_name }} je téměř plný"
          description: "Volné místo: {{ $value | printf \"%.1f\" }} %."

      - alert: VmwareHostNotConnected
        expr: vmware_host_connection_state{state="connected"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ESXi host {{ $labels.host_name }} není připojen k vCenteru"
          description: "Ověř formát metriky vmware_host_connection_state a uprav výraz podle skutečných labelů."

      - alert: VmwareHostMaintenanceMode
        expr: vmware_host_maintenance_mode == 1
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "ESXi host {{ $labels.host_name }} je v maintenance mode"
          description: "Host je v režimu údržby."

      - alert: VmwareHostHighCpu
        expr: 100 * vmware_host_cpu_usage / vmware_host_cpu_max > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Vysoké vytížení CPU na ESXi {{ $labels.host_name }}"
          description: "CPU: {{ $value | printf \"%.0f\" }} %."

      - alert: VmwareHostHighMemory
        expr: 100 * vmware_host_memory_usage / vmware_host_memory_max > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Vysoké využití RAM na ESXi {{ $labels.host_name }}"
          description: "RAM: {{ $value | printf \"%.0f\" }} %."

      - alert: VmwareSnapshotOld
        expr: (time() - vmware_vm_snapshot_timestamp_seconds) / 86400 > 7
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Starý snapshot na VM {{ $labels.vm_name }}"
          description: "Snapshot je starý {{ $value | printf \"%.0f\" }} dní."

  - name: ipmi-ilo
    rules:
      - alert: IpmiCollectorFailed
        expr: ipmi_up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "IPMI kolektor {{ $labels.collector }} selhává na {{ $labels.instance }}"
          description: "Zkontroluj IPMI over LAN, uživatele a heslo na iLO."

      - alert: HardwareSensorWarning
        expr: '{__name__=~"ipmi_(temperature|fan_speed|voltage|current|power|sensor)_state"} == 1'
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Varování senzoru {{ $labels.name }} na {{ $labels.instance }}"
          description: "IPMI senzor hlásí stav warning."

      - alert: HardwareSensorCritical
        expr: '{__name__=~"ipmi_(temperature|fan_speed|voltage|current|power|sensor)_state"} == 2'
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kritický stav senzoru {{ $labels.name }} na {{ $labels.instance }}"
          description: "IPMI senzor hlásí stav critical (teplota, ventilátor, zdroj…)."

      - alert: ServerPoweredOff
        expr: ipmi_chassis_power_state == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Server {{ $labels.instance }} je vypnutý"
          description: "iLO hlásí, že chassis je bez napájení."

  - name: network
    rules:
      - alert: SwitchPortDown
        expr: ifOperStatus{ifAlias!="",ifAlias!~".*Interface$"} == 2 and on (instance, ifIndex) ifAdminStatus == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Port {{ $labels.ifName }} ({{ $labels.ifAlias }}) na {{ $labels.instance }} je down"
          description: "Port s popisem je administrativně zapnutý, ale bez linky."

      - alert: SwitchPortErrors
        expr: rate(ifInErrors[5m]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Chyby na portu {{ $labels.ifName }} ({{ $labels.instance }})"
          description: "{{ $value | printf \"%.1f\" }} chyb/s na vstupu."

      - alert: ComwareHighCpu
        expr: comware_entity_cpu_usage_percent > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Vysoké CPU na switchi {{ $labels.instance }}"
          description: "CPU: {{ $value }} %."

      - alert: ComwareHighTemperature
        expr: comware_entity_temperature_celsius > 70 and comware_entity_temperature_celsius < 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Vysoká teplota na switchi {{ $labels.instance }} ({{ $labels.entity_name }})"
          description: "Teplota: {{ $value }} °C."

      - alert: BrocadeSwitchNotOnline
        expr: brocade_switch_oper_status != 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Brocade {{ $labels.name }} není online"
          description: "swOperStatus = {{ $value }} (2=offline, 3=testing, 4=faulty)."

      - alert: BrocadeSensorProblem
        expr: brocade_sensor_status == 2 or brocade_sensor_status == 3 or brocade_sensor_status == 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Problém se senzorem na Brocade {{ $labels.name }}: {{ $labels.sensor_info }}"
          description: "Stav senzoru {{ $value }} (2=faulty, 3=pod minimem, 5=nad maximem)."

      - alert: MsaUnitWarning
        expr: msa_unit_status == 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MSA {{ $labels.instance }} hlásí varování"
          description: "connUnitStatus = warning. Zkontroluj SMU."

      - alert: MsaUnitFailed
        expr: msa_unit_status == 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MSA {{ $labels.instance }} hlásí chybu"
          description: "connUnitStatus = failed. Zkontroluj SMU."

      - alert: MsaSensorProblem
        expr: msa_sensor_status >= 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Senzor {{ $labels.sensor_name }} na MSA {{ $labels.instance }}"
          description: "Stav {{ $value }} (4=warning, 5=failed)."

  - name: fortigate
    rules:
      - alert: FortigateHighCpu
        expr: fortigate_system_cpu_usage_ratio > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Vysoké CPU na FortiGate {{ $labels.instance }}"
          description: "CPU: {{ $value | humanizePercentage }}."

      - alert: FortigateHighMemory
        expr: fortigate_system_memory_usage_ratio > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Vysoké využití paměti na FortiGate {{ $labels.instance }}"
          description: "Paměť: {{ $value | humanizePercentage }}."
