groups:
  - name: windows
    rules:
      - alert: WindowsHighCpuUsage
        expr: 100 - (avg by (instance) (rate(windows_cpu_time_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Vysoké vytížení CPU na {{ $labels.instance }}"
          description: "CPU je vytížené na {{ $value | printf \"%.0f\" }} %."

      - alert: WindowsLowMemory
        expr: |
          (100 * (1 - windows_memory_physical_free_bytes / windows_memory_physical_total_bytes) > 90)
          or
          (100 * (1 - windows_os_physical_memory_free_bytes / windows_cs_physical_memory_bytes) > 90)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Málo volné paměti na {{ $labels.instance }}"
          description: "Využití paměti je {{ $value | printf \"%.0f\" }} %."

      - alert: WindowsDiskSpaceLow
        expr: 100 * windows_logical_disk_free_bytes{volume!~"HarddiskVolume.*"} / windows_logical_disk_size_bytes{volume!~"HarddiskVolume.*"} < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Dochází místo na disku {{ $labels.volume }} ({{ $labels.instance }})"
          description: "Volné místo: {{ $value | printf \"%.1f\" }} %."

      - alert: WindowsDiskSpaceCritical
        expr: 100 * windows_logical_disk_free_bytes{volume!~"HarddiskVolume.*"} / windows_logical_disk_size_bytes{volume!~"HarddiskVolume.*"} < 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kriticky málo místa na {{ $labels.volume }} ({{ $labels.instance }})"
          description: "Volné místo: {{ $value | printf \"%.1f\" }} %."
