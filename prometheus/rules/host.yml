groups:
  - name: host
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Cíl {{ $labels.instance }} ({{ $labels.job }}) je nedostupný"
          description: "Prometheus nemůže stáhnout metriky déle než 2 minuty."

      - alert: HostHighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Vysoké vytížení CPU na {{ $labels.instance }}"
          description: "CPU je vytížené na {{ $value | printf \"%.0f\" }} % déle než 10 minut."

      - alert: HostLowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Málo volné paměti na {{ $labels.instance }}"
          description: "Dostupná paměť je {{ $value | printf \"%.1f\" }} %."

      - alert: HostDiskSpaceWarning
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"}) * 100 < 15
          and node_filesystem_readonly == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Dochází místo na disku {{ $labels.mountpoint }} ({{ $labels.instance }})"
          description: "Volné místo: {{ $value | printf \"%.1f\" }} %."

      - alert: HostDiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"}) * 100 < 5
          and node_filesystem_readonly == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kriticky málo místa na {{ $labels.mountpoint }} ({{ $labels.instance }})"
          description: "Volné místo: {{ $value | printf \"%.1f\" }} %."

      - alert: HostDiskWillFillIn24Hours
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"}[6h], 24 * 3600) < 0
          and node_filesystem_readonly == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} na {{ $labels.instance }} se do 24 h zaplní"
          description: "Podle trendu posledních 6 hodin dojde místo do 24 hodin."

      - alert: HostSystemdServiceFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Služba {{ $labels.name }} selhala na {{ $labels.instance }}"
          description: "systemd unit je ve stavu failed."

      - alert: HostClockSkew
        expr: abs(node_timex_offset_seconds) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Nesynchronizovaný čas na {{ $labels.instance }}"
          description: "Odchylka hodin je {{ $value }} s."

      - alert: HostRebooted
        expr: (node_time_seconds - node_boot_time_seconds) < 600
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Server {{ $labels.instance }} byl restartován"
          description: "Uptime je kratší než 10 minut."
