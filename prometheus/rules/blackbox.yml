groups:
  - name: blackbox
    rules:
      - alert: ProbeFailed
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kontrola {{ $labels.instance }} selhala ({{ $labels.job }})"
          description: "Cíl neodpovídá déle než 2 minuty."

      - alert: ProbeSlow
        expr: avg_over_time(probe_duration_seconds[5m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pomalá odezva {{ $labels.instance }}"
          description: "Průměrná doba odezvy {{ $value | printf \"%.2f\" }} s."

      - alert: SslCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certifikát {{ $labels.instance }} brzy vyprší"
          description: "Platnost končí za {{ $value | printf \"%.0f\" }} dní."

      - alert: SslCertificateExpired
        expr: (probe_ssl_earliest_cert_expiry - time()) < 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Certifikát {{ $labels.instance }} vypršel"
          description: "SSL certifikát už není platný."
