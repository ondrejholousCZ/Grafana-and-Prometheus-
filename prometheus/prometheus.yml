global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: main

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: monitoring

  - job_name: blackbox-exporter
    static_configs:
      - targets: ['blackbox:9115']

  - job_name: node
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          instance: monitoring

  - job_name: linux-servers
    file_sd_configs:
      - files: ['/etc/prometheus/targets/linux/*.yml']
        refresh_interval: 1m

  - job_name: windows-servers
    file_sd_configs:
      - files: ['/etc/prometheus/targets/windows/*.yml']
        refresh_interval: 1m

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/http/*.yml']
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/icmp/*.yml']
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: vsphere
    scrape_interval: 60s
    scrape_timeout: 50s
    static_configs:
      - targets: ['vmware-exporter:9272']
        labels:
          instance: vcenter

  - job_name: snmp-exporter
    static_configs:
      - targets: ['snmp-exporter:9116']

  - job_name: ipmi-exporter
    static_configs:
      - targets: ['ipmi-exporter:9290']

  - job_name: snmp-if
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [infra_v2]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/snmp-if/*.yml']
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  - job_name: snmp-brocade
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /snmp
    params:
      module: [brocade_fc]
      auth: [infra_v2]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/snmp-brocade/*.yml']
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  - job_name: snmp-comware
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /snmp
    params:
      module: [comware]
      auth: [infra_v3]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/snmp-comware/*.yml']
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  - job_name: snmp-msa
    scrape_interval: 120s
    scrape_timeout: 60s
    metrics_path: /snmp
    params:
      module: [msa_fa]
      auth: [infra_v2]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/snmp-msa/*.yml']
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  - job_name: ipmi-ilo
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /ipmi
    params:
      module: [default]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/ipmi/*.yml']
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: ipmi-exporter:9290

  - job_name: fortigate
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /probe
    file_sd_configs:
      - files: ['/etc/prometheus/targets/fortigate/*.yml']
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: fortigate-exporter:9710
